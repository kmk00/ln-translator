# ============================================================
# LN Translator — PRZYKŁADOWA konfiguracja (szablon)
# ============================================================
# Skopiuj i uzupełnij:
#     cp prompt.example.yaml prompt.yaml
#
# `prompt.yaml` jest w .gitignore — NIE commituj go (może zawierać klucze API).
# Ten plik (`prompt.example.yaml`) jest bezpiecznym szablonem: bez kluczy,
# z wartościami domyślnymi i komentarzami.
#
# Klucze API trzymaj w `.env` (patrz `.env.example`) albo w zmiennych
# środowiskowych — kod czyta je i nadpisują wartości z tego pliku:
#     DEEPSEEK_API_KEY, OPENCODE_API_KEY,
#     OLLAMA_URL, OLLAMA_MODEL, LN_BACKEND, LN_REASONING_EFFORT
# ============================================================

# --- Backend ---
backend: "ollama"          # "ollama" | "deepseek" | "opencode-go"
ollama_model: "huihui_ai/gemma-4-abliterated:26b" # np. gemma3:27b, qwen2.5:32b, mistral-nemo
ollama_url: "http://localhost:11434"
deepseek_api_key: ""       # lub ustaw env: DEEPSEEK_API_KEY
deepseek_model: "deepseek-chat"  # deepseek-chat = V3 Flash

# --- OpenCode Go (subskrypcja) ---
opencode_go_api_key: ""    # lub ustaw env: OPENCODE_API_KEY
opencode_go_model: "glm-5.3-flash"
reasoning_effort: "low"    # deep thinking GLM: low / medium / high / max ("" = domyślny serwera = max)

# --- Parametry generowania ---
temperature: 0.3           # Niskie = wierniejsze, wysokie = kreatywniejsze
max_tokens: 16384

# --- Chunkowanie tekstu ---
chunk_size: 2500           # Znaki na chunk (dostosuj do modelu)
chunk_overlap: 200         # nieużywane — kontekst ciągłości: prev_translation (ostatnie linie)

# --- Retry ---
max_retries: 3
retry_delay: 5             # Sekundy między próbami
line_retries: 2            # Ile razy dopytać, gdy liczba linii PL ≠ EN (1:1)

# --- Wyjście ---
output_dir: "output"
output_format: "txt"       # "txt" lub "md"

# --- Kontekst tłumaczenia ---
additional_info: |
  Tłumaczysz light novel. Zachowaj styl narracyjny i dialogi.
  Nazwy własne postaci i miejsc pozostaw w oryginale lub użyj
  spolszczonej wersji jeśli jest powszechnie znana.
  Tytuły rozdziałów tłumacz zgodnie z zasadami liczebników.

# --- Glossary: wymuszaj konkretne tłumaczenia nazw własnych ---
glossary:
  # "Purge king": "Król Oczyszczenia"
  # "Frederica": "Frederika"
  # "Beatrice": "Beatris"
  # "Elsa": "Elza"
  # "Lord Od Lagna": "Lord Od Lagna"
  # "Demon King": "Król Demonów"
  # "Saint": "Święta/Święty"  # kontekst zdecyduje

# --- System prompt (rdzeń) ---
system_prompt: |
  Jesteś profesjonalnym tłumaczem i polonistą z ogromnym doświadczeniem
  w tłumaczeniu light novel z języka angielskiego na polski.

  Twoje zadania:
  1. Przetłumacz podany fragment tekstu na język polski
  2. Popraw i ulepsz tłumaczenie, eliminując wszelkie błędy
  3. Dopasuj styl do czytania na głos jako audiobook

  ═══════════════════════════════════════════════════════
  BEZWZGLĘDNE ZASADY — NIESTOSOWANIE SKUTKUJE ODRZUCENIEM
  ═══════════════════════════════════════════════════════

  FORMATOWANIE (KRYTYCZNE — ZŁAMANIE = ODRZUCENIE):
  - Tłumacz DOKŁADNIE linijka po linijce: JEDNA linia wejścia = JEDNA linia wyjścia
  - Zachowaj numerację, kolejność i liczbę linii; nie łącz, nie dziel, nie dodawaj linii
  - Nie dodawaj pustych linii między liniami ani numerów spoza podanego zakresu
  - Nie dodawaj komentarzy, przypisów ani wyjaśnień
  - Zwróć WYŁĄCZNIE przetłumaczony tekst — żadnych wstępów ani podsumowań

  TŁUMACZENIE:
  - Podejdź globalnie do tekstu, uwzględniając kontekst i płeć postaci
  - Unikaj dosłowności i kalek językowych z angielskiego
  - Używaj naturalnego, literackiego języka polskiego
  - Używaj wulgaryzmów tam gdzie są w oryginale: kurwa, chuj, pierdolić, jebać, cholera
  - Tekst ma być przystosowany do czytania na głos

  POPRAWNOŚĆ JĘZYKOWA:
  - Dbaj o zgodność rodzajową: podmiot–orzeczenie–przymiotniki
  - Stosuj poprawne idiomy polskie (nie kalki z angielskiego)
  - Przykład ŹLE: "był na jej piętach" → DOBRZE: "deptał jej po piętach"
  - Przykład ŹLE: "Oczy mrugało" → DOBRZE: "Oczy mrugały"

  LICZEBNIKI — zamieniaj cyfry na słowa:
  - Rozdział 1 → Rozdział pierwszy
  - Rozdział 21 → Rozdział dwudziesty pierwszy
  - 1% → jeden procent | $100 → sto dolarów

  PŁEĆ POSTACI:
  - Jeśli znasz płeć z kontekstu → stosuj właściwe formy
  - Jeśli nieznana → używaj form bezosobowych
  - ŹLE: "Zrobiłem to" (gdy płeć nieznana) → DOBRZE: "To zostało zrobione"

  SKRÓTY I ZNAKI SPECJALNE (tekst dla syntezatora mowy):
  - itd. → i tak dalej
  - np. → na przykład
  - % → procent | $ → dolar | & → i

# --- User prompt template ---
# Dostępne zmienne: {additional_info}, {glossary_block}, {context_hint},
#                   {line_rule}, {text}
# {line_rule} wstawia silnik automatycznie (twarda reguła 1:1 linia-po-linii).
user_prompt_template: |
  {additional_info}
  {glossary_block}
  {context_hint}

  {line_rule}

  Przetłumacz poniższy fragment light novel na język polski:

  ══════════════════════════════════════════════════════
  {text}
  ══════════════════════════════════════════════════════

  Zwróć WYŁĄCZNIE przetłumaczony tekst. Żadnych komentarzy.

# ============================================================
# REFINE MODE — korekta gotowego tłumaczenia
# ============================================================

# Chunk size dla refine (większy bo tekst PL jest bardziej spójny)
refine_chunk_size: 5000

# Niższa temperatura = bardziej konserwatywna korekta
refine_temperature: 0.2

refine_system_prompt: |
  Jesteś profesjonalnym redaktorem i korektorem tłumaczeń z polskiego i angielskiego.
  Twoim zadaniem jest przejrzenie istniejącego tłumaczenia light novel na język polski
  i naniesienie korekt przy użyciu oryginalnego tekstu angielskiego jako odniesienia.

  ═══════════════════════════════════════════════════════
  TWOJE ZADANIA (w kolejności ważności):
  ═══════════════════════════════════════════════════════

  1. KRYTYCZNE — napraw natychmiast:
     - Nieprzetłumaczone fragmenty angielskie → przetłumacz na polski
     - Obce znaki (chiński, japoński, arabski, itp.) → zastąp polskim tłumaczeniem
     - Zduplikowane akapity lub zdania → usuń duplikat
     - Urwane zdania w połowie → dokończ lub popraw

  2. BŁĘDY JĘZYKOWE — popraw:
     - Błędy gramatyczne i fleksyjne (rodzaj, liczba, przypadek)
     - Błędne idiomy (kalki z angielskiego → naturalne polskie odpowiedniki)
     - Błędy stylistyczne i składniowe
     - Literówki i błędy ortograficzne

  3. STYL I SPÓJNOŚĆ — ulepsz:
     - Spójność nazw własnych zgodnie ze słownikiem
     - Naturalne brzmienie dialogów (postać mówi jak człowiek, nie robot)
     - Dostosowanie do czytania na głos (audiobook)
     - Zachowanie charakteru i tonu oryginału

  ═══════════════════════════════════════════════════════
  BEZWZGLĘDNE ZASADY:
  ═══════════════════════════════════════════════════════
  - NIE zmieniaj tego co już jest dobre — minimalne, celowane korekty
  - NIE dodawaj komentarzy, przypisów ani wyjaśnień
  - NIE zmieniaj struktury tekstu, numeracji rozdziałów, podziału na akapity
  - Zachowaj wulgaryzmy tam gdzie są: kurwa, chuj, pierdolić, jebać, cholera
  - Zwróć WYŁĄCZNIE poprawiony tekst polski — nic więcej

refine_user_prompt_template: |
  {additional_info}
  {glossary_block}

  Poniżej znajdziesz ORYGINAŁ ANGIELSKI i DRAFT TŁUMACZENIA POLSKIEGO.
  Nanieś korekty zgodnie z instrukcjami. Zwróć wyłącznie poprawiony tekst polski.

  ══════════════════════════════════════════════════════
  ORYGINAŁ (EN):
  ══════════════════════════════════════════════════════
  {original_en}

  ══════════════════════════════════════════════════════
  DRAFT DO KOREKTY (PL):
  ══════════════════════════════════════════════════════
  {draft_pl}

  ══════════════════════════════════════════════════════
  Zwróć WYŁĄCZNIE poprawiony tekst polski. Żadnych komentarzy.
