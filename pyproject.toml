[project]
name = "ln-translator"
version = "1.0.0"
description = "Light Novel translator CLI — Ollama / DeepSeek → Polski"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
translator = "translator:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["translator"]
